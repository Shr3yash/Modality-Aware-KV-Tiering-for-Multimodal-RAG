[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "modality-aware-kv-tiering"
version = "0.1.0"
description = "Modality-aware tiered KV cache and CacheClip-style KV reuse for multimodal (vision-language) RAG on vLLM."
requires-python = ">=3.10"
dependencies = [
    "vllm==0.6.3",
    "torch==2.2.1",
    "torchvision==0.17.1",
    "transformers==4.40.0",
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.6.0",
    "pyyaml==6.0.1",
    "faiss-cpu==1.8.0",
    "open-clip-torch==2.24.0",
    "Pillow==10.2.0",
    "datasets==2.18.0",
    "structlog==24.1.0",
    "prometheus-client==0.20.0",
    "safetensors==0.4.0",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

