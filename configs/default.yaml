model:
  name: "llava-hf/llava-v1.6-mistral-7b-hf"
  dtype: "float16"
  max_model_len: 4096
  gpu_memory_utilization: 0.85

rag:
  chunk_size_tokens: 512
  top_k: 5
  embedding_model: "openai/clip-vit-large-patch14"
  corpus_dir: "./data/corpus"

cache:
  gpu_blocks: 2048
  cpu_blocks: 8192
  ssd_capacity_gb: 50
  ssd_path: "/tmp/kv_ssd_cache"
  block_size: 16
  eviction_policy: "modality_aware_lru"
  text_gpu_pin_ratio: 0.7
  recompute_top_k: 32

serving:
  host: "0.0.0.0"
  port: 8000
  max_concurrent: 16

eval:
  num_samples: 500
  batch_sizes: [1, 2, 4, 8, 16, 32]
  warmup_queries: 10

